services:
  db:
    image: mysql:8.0
    container_name: kodepromo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-kodepromo}
      MYSQL_USER: ${DB_USERNAME:-kodepromo_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ubah_password_di_env_lokal}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - kodepromo_db_data:/var/lib/mysql
    networks:
      - kodepromo-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    image: ${DOCKERHUB_USERNAME:-kodepromo}/kodepromo-api:${IMAGE_TAG:-latest}
    container_name: kodepromo-api
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-KodePromo}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:dGVzdGtleXRoYXRpc2JhczY0ZW5jb2RlZDMyYnl0ZXM=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Jakarta}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kodepromo}
      DB_USERNAME: ${DB_USERNAME:-kodepromo_user}
      DB_PASSWORD: ${DB_PASSWORD:-ubah_password_di_env_lokal}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kodepromo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ecommerce-demo:
    build:
      context: ./ecommerce-demo
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-kodepromo}/kodepromo-demo:${IMAGE_TAG:-latest}
    container_name: kodepromo-demo
    restart: unless-stopped
    environment:
      PORT: ${DEMO_APP_PORT:-8080}
      KODEPROMO_API_URL: ${KODEPROMO_API_URL:-http://api:8000}
      KODEPROMO_API_KEY: ${KODEPROMO_API_KEY:-}
    ports:
      - "${DEMO_APP_PORT:-8080}:${DEMO_APP_PORT:-8080}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kodepromo-net

volumes:
  kodepromo_db_data:

networks:
  kodepromo-net:
    driver: bridge
